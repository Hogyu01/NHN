<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던전 식당</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="screen-start" class="screen">
    <h1 class="title">던전 식당</h1>
    <p class="subtitle">실패한 모험가, 던전 앞 식당을 차리다</p>
    <button id="btn-start" class="btn-primary">시작하기</button>
  </section>

  <section id="screen-room" class="screen hidden">
    <canvas id="game-canvas" width="480" height="480"></canvas>
    <p class="hint">방향키 또는 WASD로 이동하세요</p>

    <div id="panel-overlay" class="panel-overlay hidden">
      <div class="panel">
        <h2 id="panel-title"></h2>
        <p id="panel-body"></p>
        <button id="btn-panel-close" class="btn-primary">닫기</button>
      </div>
    </div>
  </section>

</div>
<script src="js/main.js"></script>
</body>
</html>
